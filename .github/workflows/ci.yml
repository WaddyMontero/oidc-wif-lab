name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Run app tests
        run: |
          cd app
          export PYTHONPATH=.
          pytest -q tests

      - name: Build container locally
        run: docker build -t oidc-wif-lab:ci ./app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init for validation
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Run guardrail checks
        run: ./scripts/check-guardrails.sh
